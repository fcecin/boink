name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Real cron needs the daemon running on the Ubuntu runner.
      - name: Ensure cron is installed and running (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cron
          sudo service cron start || sudo cron || true
          pgrep -x cron && echo "cron daemon running"

      # POSIX suite: state machine, hooks, daemon fallback, hermetic scheduler
      # generation, and the REAL cron (Linux) / launchd (macOS) fire test.
      - name: Run POSIX tests
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/run.sh

      # Windows-native suite: state machine, hooks, daemon fallback, and the
      # REAL Task Scheduler fire test.
      - name: Run Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1

      # Bonus cross-check: the POSIX `boink` also runs under Git Bash on Windows.
      - name: Run POSIX tests under Git Bash (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: sh tests/run.sh
